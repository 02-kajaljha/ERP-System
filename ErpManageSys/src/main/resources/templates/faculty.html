<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Faculty ERP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            text-align: center;
            padding: 20px 0;
        }
        h1 {
            margin: 0;
        }
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .faculty-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .faculty-info div {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            margin-right: 10px;
        }
        .faculty-info div:last-child {
            margin-right: 0;
        }
        .logout-btn {
            background-color: #FF5733;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            text-align: center;
            display: inline-block;
            text-decoration: none;
            margin-top: 20px;
        }
        .logout-btn:hover {
            background-color: #e04e2a;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to the Faculty ERP System</h1>
    </header>
    
    <div class="container">
        <h2>Welcome, Faculty Member!</h2>
        <p>Below are your details:</p>
        
        <div class="faculty-info">
            <div>
                <h3>Name:</h3>
                <p>Dr. Jane Smith</p>
            </div>
            <div>
                <h3>Department:</h3>
                <p>Computer Science</p>
            </div>
            <div>
                <h3>Designation:</h3>
                <p>Professor</p>
            </div>
        </div>
        
        <div class="faculty-info">
            <div>
                <h3>Faculty ID:</h3>
                <p>98765432</p>
            </div>
            <div>
                <h3>Email:</h3>
                <p>janesmith@university.com</p>
            </div>
        </div>

        <a href="logout.html" class="logout-btn">Logout</a>
    </div>
</body>
</html>
