<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(to right, #007bff, #0056b3);
            color: white;
            text-align: center;
            padding: 25px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .student-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .info-card {
            padding: 20px;
            border-radius: 10px;
            background: #f9f9f9;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h3 {
            margin: 0 0 8px;
            font-size: 16px;
            color: #333;
        }

        p {
            font-size: 15px;
            color: #555;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .button:hover {
            background-color: #218838;
        }

        .error-message {
            text-align: center;
            color: red;
            font-size: 18px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .student-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to the Student Dashboard</h1>
    </header>

    <div class="container">
        <div th:if="${student != null}">
            <div class="student-info">
                <div class="info-card">
                    <h3>ID</h3>
                    <p th:text="${student.id}">ID</p>
                </div>
                <div class="info-card">
                    <h3>Name</h3>
                    <p th:text="${student.name}">Name</p>
                </div>
                <div class="info-card">
                    <h3>Father's Name</h3>
                    <p th:text="${student.fathersname}">Father</p>
                </div>
                <div class="info-card">
                    <h3>Mother's Name</h3>
                    <p th:text="${student.mothersname}">Mother</p>
                </div>
                <div class="info-card">
                    <h3>DOB</h3>
                    <p th:text="${student.dob}">DOB</p>
                </div>
                <div class="info-card">
                    <h3>College</h3>
                    <p th:text="${student.college}">College</p>
                </div>
                <div class="info-card">
                    <h3>Course</h3>
                    <p th:text="${student.course}">Course</p>
                </div>
                <div class="info-card">
                    <h3>Year</h3>
                    <p th:text="${student.year}">Year</p>
                </div>
                <div class="info-card">
                    <h3>Branch</h3>
                    <p th:text="${student.branch}">Branch</p>
                </div>
                <div class="info-card">
                    <h3>Section</h3>
                    <p th:text="${student.section}">Section</p>
                </div>
                <div class="info-card">
                    <h3>Roll No</h3>
                    <p th:text="${student.rollno}">Roll</p>
                </div>
                <div class="info-card">
                    <h3>High School</h3>
                    <p th:text="${student.highschool}">High School</p>
                </div>
                <div class="info-card">
                    <h3>Intermediate</h3>
                    <p th:text="${student.intermediate}">Intermediate</p>
                </div>
            </div>
            <a href="/students" class="button">Back to Student List</a>
